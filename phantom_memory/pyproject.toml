[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-memory"
version = "0.1.0"
description = "PHANTOM MEMORY — Security Memory Reconstruction Platform (backend core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
phantom-memory = "phantom_memory.cli.main:app"

[tool.setuptools.packages.find]
include = ["phantom_memory*"]
